# Runs when a version tag (X.Y.Z, without a "v") is pushed: checks and builds
# the tagged commit, publishes it to npm through trusted publishing, which
# adds provenance, attaches the built files to a GitHub Release, and deploys
# the demo to GitHub Pages. Nothing here runs on branches. CONTRIBUTING.md
# lists what has to be set up once before the first release.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is the package version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./package.json').version")"
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm test:dist
      - run: pnpm test:release
      - name: Notes from the changelog
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Publish to npm
        run: |
          name="$(node -p "require('./package.json').name")"
          if [ -n "$(npm view "$name@$GITHUB_REF_NAME" version 2>/dev/null)" ]; then
            echo "$name@$GITHUB_REF_NAME is already on npm"
          else
            pnpm publish --no-git-checks
          fi
      - name: GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
          dist/agent-build.js dist/agent-build.min.js dist/agent-build.mjs dist/auto.mjs
          dist/agent-build.css dist/agent-build.min.css
      - name: The demo site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R index.html llms.txt demo dist "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  pages:
    name: Deploy the demo
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
